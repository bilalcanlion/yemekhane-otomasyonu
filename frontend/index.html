<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
  <script src="/js/ortak.js" defer></script>
  <script src="/js/giris.js" defer></script>
</head>
<body>
  <main class="giris-zemin">
    <section class="kart giris-kart" aria-labelledby="giris-baslik">
      <p class="marka"><span class="marka-isaret" aria-hidden="true"></span>Yemekhane</p>
      <h1 id="giris-baslik" class="giris-alt">Kampüs yemekhanesi menü, rezervasyon ve bakiye</h1>

      <p id="bildirim" class="bildirim" hidden></p>

      <form id="giris-formu" novalidate>
        <div class="alan">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" autocomplete="username" required>
        </div>
        <div class="alan">
          <label for="sifre">Şifre</label>
          <input id="sifre" name="sifre" type="password" autocomplete="current-password" required>
        </div>
        <button class="dugme dugme-tam" type="submit">Giriş yap</button>
      </form>
    </section>
  </main>
</body>
</html>
