<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Günün Menüsü · Yemekhane</title>
  <link rel="stylesheet" href="/css/temel.css">
  <link rel="stylesheet" href="/css/uygulama.css">
  <script src="/js/ortak.js" defer></script>
  <script src="/js/menu.js" defer></script>
</head>
<body>
  <header id="ust" class="ust"></header>
  <main class="kapsayici sayfa">
    <div class="sayfa-baslik"><h1>Günün Menüsü</h1></div>

    <form id="filtre" class="filtre">
      <div class="tam">
        <label for="yemekhane">Yemekhane</label>
        <select id="yemekhane" name="yemekhane"></select>
      </div>
      <div>
        <label for="ogun">Öğün</label>
        <select id="ogun" name="ogun"></select>
      </div>
      <div>
        <label for="tarih">Tarih</label>
        <input id="tarih" name="tarih" type="date">
      </div>
    </form>

    <p id="bildirim" class="bildirim" hidden></p>
    <section id="menu" aria-live="polite"></section>
  </main>
</body>
</html>
